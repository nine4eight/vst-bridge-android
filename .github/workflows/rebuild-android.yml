name: Rebuild Android runtime APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Windows host payload
        uses: actions/download-artifact@v4
        with:
          name: vst-bridge-windows-x86_64-host
          path: app/src/main/assets/runtime/windows-x86_64
          repository: nine4eight/vst-bridge-android
          run-id: 39629566921
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build runtime APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Verify embedded Windows host
        run: unzip -t app/build/outputs/apk/debug/app-debug.apk assets/runtime/windows-x86_64/vst-bridge-host.exe

      - name: Upload runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: vst-bridge-runtime-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
